name: Daily Push Reminders

# 每 30 分鐘觸發一次（支援半小時提醒）。發送端會判斷誰的提醒時間已到、
# 當天未抽卡、當天未通知過，並有 90 分鐘補送視窗吸收排程延遲。
#
# 注意：cron 刻意設在 :07 / :37，避開整點 :00 / :30 —— GitHub Actions
# 在每個整點負載最重，:00/:30 的排程最常被延遲甚至直接丟棄。錯開幾分鐘
# 可大幅提高排程實際被觸發的機率；補送視窗會吸收這點偏移。
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {} # 允許手動觸發測試

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 未設定（GitHub repo → Settings → Secrets and variables → Actions → Secrets）"
            exit 1
          fi
          # 正式網址非機密，直接寫死，少一個要設定的東西
          curl -sS -f -X POST \
            "https://daily-lumos.vercel.app/api/send-reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json"
