name: Daily Push Reminders

# 推播提醒的「備援」排程。主排程器是每分鐘觸發的 cron-job.org；
# 此 workflow 僅在 cron-job.org 異常時兜底（重複呼叫不會造成重複推播，
# 後端有當日去重機制）。
#
# cron 刻意設在 :07 / :37，避開整點 :00 / :30 —— GitHub Actions 在每個
# 整點負載最重，:00/:30 的排程最常被延遲甚至直接丟棄。
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {} # 允許手動觸發測試

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET 未設定（GitHub repo → Settings → Secrets and variables → Actions → Secrets）"
            exit 1
          fi
          # 正式網址非機密，直接寫死，少一個要設定的東西
          curl -sS -f -X POST \
            "https://daily-lumos.vercel.app/api/send-reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json"
